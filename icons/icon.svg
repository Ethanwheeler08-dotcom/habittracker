<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1d3a28"/>
      <stop offset="0.55" stop-color="#0c140f"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5df58a"/>
      <stop offset="1" stop-color="#1fbf54"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ring track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#30d158" stroke-opacity="0.16" stroke-width="44"/>
  <!-- ring fill, ~85% round, starting at 12 o'clock -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"
          stroke-dasharray="801 942.5" transform="rotate(-90 256 256)" filter="url(#glow)"/>
  <!-- check -->
  <path d="M188 262 L237 311 L330 205" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flame spark where the ring ends -->
  <g transform="translate(155 147) rotate(-38)">
    <path d="M0 -38 C10 -16 32 -4 32 22 A32 32 0 0 1 -32 22 C-32 6 -24 -4 -14 -12 C-12 0 -6 6 2 8 C0 -10 -2 -24 0 -38Z" fill="#ff9f0a"/>
    <path d="M0 44 A14 14 0 0 1 -14 30 C-14 20 -6 15 -2 6 C4 14 14 20 14 30 A14 14 0 0 1 0 44Z" fill="#ffd60a"/>
  </g>
</svg>
